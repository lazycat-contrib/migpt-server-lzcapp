version: 1

project:
  root: .
  build_config: lzc-build.yml
  package_file: package.yml
  output: .lazycat-build/migpt-server.lpk
  target_arch: amd64

update:
  strategy: publish
  allow_downgrade: false
  version_source:
    type: image
    image: migpt-server
build:
  run_buildscript: false
images:
  - id: migpt-server
    target: service
    service: migpt-server
    source: lmk123/migpt-server
    channel: stable
    sort: semver
    tag_regex: '^v?\d+\.\d+\.\d+$'
    delivery:
      mode: mirror
stores:
  official:
    enabled: false
    skip_if_version_exists: true
  private:
    enabled: true
    skip_if_version_exists: true
    name: MiGPT GUI
    summary: "安全、快速的给你的小爱音箱接入人工智能。"
